<aside class="p-3 fixed h-[85%] top-20 bg-white flex flex-col gap-2 rounded-xl border border-slate-200 ">
    <div class="head flex justify-between items-center">
        <div class="left font-bold text-gray-900 capitalize">
            <span class="text-blue-400 me-2"> <i class="fa-solid fa-user-group"></i> </span>Suggested Friends
        </div>
        <div
            class="right text-sm text-gray-600 bg-secondColor w-6.5 h-6.5 flex justify-center font-bold items-center rounded-full">
            {{count}}
        </div>
    </div>

    

    <div class="mt-3 grid grid-cols-1 gap-3 overflow-y-scroll">
        @for (frient of frients; track $index) {
        <app-frient-suggestion [frient]="frient" (follow)="followFriend($event)"></app-frient-suggestion>
        }
    </div>
    <button
     (click)="more()"
        class="inline-flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-100">View
        more</button>

</aside>
