<div class="mt-3">


    <div class="flex items-start gap-2">

        <img src="https://pub-3cba56bacf9f4965bbb0989e07dada12.r2.dev/linkedPosts/default-profile.png"
            class="h-9 w-9 rounded-full object-cover" />
        <div class="w-full">
            <div
                class="w-full rounded-2xl border border-slate-200 bg-secondary px-2.5 py-1.5 focus-within:border-[#c7dafc] focus-within:bg-white">

                <textarea [formControl]="commentBody" placeholder="Comment..." rows="1"
                    class="max-h-35 min-h-10 w-full resize-none bg-transparent px-2 py-1.5 text-sm outline-none placeholder:text-slate-500 ring-0 border-0"></textarea>

                <div class="mt-1 flex items-center justify-between">

                    <!-- Left icons -->
                    <div class="flex items-center gap-1">

                        <label
                            class="cursor-pointer rounded-full py-2 px-2.5 text-slate-500 hover:bg-slate-200 hover:text-emerald-600">
                            <i class="fa-regular fa-image"></i>
                            <input type="file" class="hidden" (change)="changeImage($event)" />
                        </label>

                        <button class="rounded-full py-2 px-2.5 text-slate-500 hover:bg-slate-200 hover:text-amber-500">
                            <i class="fa-regular fa-face-smile"></i>
                        </button>

                    </div>

                    <!-- Send -->



                    @if(!this.editData){

                    <button (click)="createComment($event)" type="submit"
                        class="flex h-9 w-9 items-center justify-center rounded-full  text-blue-600 hover:text-[#166fe5] cursor-pointer">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>

                    }
                    @else{
                    <button (click)="updateData($event) " type="submit"
                        class="flex h-9 w-9 items-center justify-center rounded-full  text-blue-600 hover:text-[#166fe5] cursor-pointer">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>

                    }

                </div>

            </div>
            @if(commentImagePreview){
            <div class="img-holder relative w-fit" (click)="removeImage()">
                @if(!this.editData){
                    <span
                    class="cursor-pointer absolute top-2 right-2 py-2 px-2.4 rounded-full min-w-6 h-6 flex justify-center items-center text-white bg-red-600 text-2xs">
                    <i class="fa-solid fa-x"></i> 
                </span>
                }
                <img [src]="commentImagePreview" class="rounded-lg mt-2 w-60">
            </div>
            }
        </div>
    </div>



</div>
