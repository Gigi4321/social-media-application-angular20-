<div class="border-t border-slate-200 bg-[#f7f8fa] px-4 py-4 rounded-b-md mt-1">

    <!-- Header -->
    <div
        class="mb-3 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2">

        <div class="flex items-center gap-2">
            <p class="text-sm font-extrabold tracking-wide text-slate-700">
                Comments
            </p>

            <span class="rounded-full bg-[#e7f3ff] px-2 py-0.5 text-[11px] font-bold text-[#1877f2]">
                {{commentCount}}
            </span>
        </div>

        <select
            class="rounded-lg border border-slate-200 bg-slate-50 px-2.5 py-1.5 text-xs font-bold text-slate-700 outline-none ring-[#1877f2]/20 focus:border-[#1877f2] focus:bg-white focus:ring-2 pe-8">
            <option>Most relevant</option>
            <option>Newest</option>
        </select>

    </div>

    <!-- Comment -->
    <div class="flex flex-col gap-4">

        @for (comment of comments; track $index) {
        <app-comment-ui [comment]="comment" 
            (editButtonClicked)='hello(comment)' (likeButtonClicked)="likeComment(comment._id)" (deleteButtonClicked)="deleteComment(comment._id)">
        </app-comment-ui>
        }

    </div>

    <!-- Add Comment -->
    <app-add-comment (submitData)="createComment($event)" (editDataEvent)="updateComment($event)" [editData]="formData"></app-add-comment>
</div>
